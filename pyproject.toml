[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceguard-dual-layer-authentication"
version = "0.2.0"
description = "Palmprint DT-CWT-SVD watermarking and Siamese face verification for dual-layer authentication."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
  {name = "FaceGuard authors"}
]
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.13,<2.0",
  "scikit-learn>=1.5,<2.0",
  "scikit-image>=0.24,<0.26",
  "opencv-python-headless>=4.10,<5.0",
  "Pillow>=10,<12",
  "matplotlib>=3.9,<4.0",
  "PyYAML>=6,<7",
  "dtcwt==0.14.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "facenet-pytorch>=2.6",
  "gdown>=5,<7",
  "PyWavelets>=1.6,<2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
notebooks = ["nbformat>=5.10", "jupyter>=1.0", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
