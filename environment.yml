name: faceguard
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.5
  - scikit-image=0.24
  - matplotlib=3.9
  - pillow
  - pyyaml
  - pytorch
  - torchvision
  - pip:
      - opencv-python-headless>=4.10,<5
      - dtcwt==0.14.0
      - facenet-pytorch>=2.6
      - gdown
      - PyWavelets>=1.6,<2.0
      - openpyxl>=3.1,<4
